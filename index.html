<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yukk Kerjain: Misi Koding dan KA</title>
<style>
*{box-sizing:border-box;margin:0}body{background:#06222e;display:flex;align-items:center;justify-content:center;height:100vh;font-family:"Trebuchet MS",Arial,sans-serif}
#app{width:min(100vw,177.78vh);aspect-ratio:16/9;background:linear-gradient(135deg,#0b3c53,#0f766e);color:#10222b;position:relative;overflow:hidden;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:.5em 1.2em;color:#fff;font-size:1.05em;background:rgba(0,0,0,.25)}
.pill{background:#fff;color:#0b3c53;border-radius:2em;padding:.2em .8em;margin-left:.5em;font-weight:bold;display:inline-block}
.main{flex:1;padding:.8em 1.6em;overflow:auto;display:flex;flex-direction:column}
.card{background:#fff;border-radius:1em;padding:1em 1.4em;box-shadow:0 .3em 1em rgba(0,0,0,.3);flex:1}
.lh{display:flex;align-items:center;gap:.8em;margin-bottom:.4em}.ic{font-size:2.2em;background:#ccfbf1;border-radius:50%;width:1.6em;height:1.6em;display:flex;align-items:center;justify-content:center}
small{color:#475569;font-size:.9em}h1{font-size:3em;color:#fff;line-height:1.1}h2{font-size:1.5em;color:#0b3c53}p,li{font-size:1.1em;line-height:1.45}.intro{background:#fef3c7;border-left:.35em solid #f59e0b;padding:.4em .8em;border-radius:.4em;margin-bottom:.6em}
button{font-family:inherit;font-size:1.1em;padding:.5em 1em;margin:.2em;border:2px solid #0f766e;background:#fff;color:#0b3c53;border-radius:.6em;cursor:pointer;min-height:2.6em;transition:transform .1s}
button:hover:not(:disabled){transform:translateY(-.1em);background:#ccfbf1}button:disabled{opacity:.45;cursor:default}
button.p{background:#f59e0b;border-color:#b45309;color:#10222b;font-weight:bold}button.p:hover{background:#fbbf24}
button.sel{background:#fde68a;border-color:#b45309}button.ok{background:#bbf7d0;border-color:#15803d}button.no{background:#fecaca;border-color:#b91c1c}
.opt{display:flex;align-items:center;width:100%;text-align:left;gap:.7em}.opt b{background:#0f766e;color:#fff;border-radius:50%;min-width:1.7em;height:1.7em;display:flex;align-items:center;justify-content:center}
.fb{margin-top:.5em;padding:.6em 1em;border-radius:.6em;font-size:1.05em;min-height:2.6em}.g{background:#dcfce7;color:#14532d}.b{background:#fee2e2;color:#7f1d1d}.i{background:#e0f2fe;color:#0c4a6e}
.row{display:flex;gap:1.2em}.col{flex:1}.dots{margin-left:auto}.dots i{display:inline-block;width:.9em;height:.9em;border-radius:50%;background:#cbd5e1;margin:0 .15em}.dots i.on{background:#16a34a}.dots i.cur{background:#f59e0b}
.nav{display:flex;justify-content:center;margin-top:.5em}
.map{display:flex;justify-content:space-between;align-items:center;position:relative;margin:2em 1em}.map:before{content:"";position:absolute;left:5%;right:5%;top:2.6em;border-top:.35em dashed #99f6e4}
.node{position:relative;background:none;border:none;color:#fff;text-align:center;width:12em}.node:hover:not(:disabled){background:none}
.node .c{width:5.2em;height:5.2em;border-radius:50%;background:#fff;border:.3em solid #f59e0b;display:flex;align-items:center;justify-content:center;font-size:2em;margin:0 auto .3em}.node.d .c{border-color:#22c55e;background:#dcfce7}
.node span{display:block;font-size:.95em}.bar{height:.8em;background:rgba(255,255,255,.3);border-radius:1em;margin:0 1em}.bar i{display:block;height:100%;background:#f59e0b;border-radius:1em;transition:width .4s}
.bub{position:absolute;border-radius:50%;background:rgba(255,255,255,.12);animation:up 9s linear infinite}@keyframes up{from{transform:translateY(0)}to{transform:translateY(-120vh)}}
.drop{animation:dr .5s ease-in}@keyframes dr{from{transform:translateY(-12px);opacity:1}to{transform:translateY(30px);opacity:0}}
</style></head><body><div id="app"></div>
<script>
const A=document.getElementById('app');
function fit(){A.style.fontSize=(A.clientWidth/62)+'px'}addEventListener('resize',fit);
let AC;function snd(ok){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=ok?660:200;g.gain.value=.08;o.start();o.stop(AC.currentTime+.18)}catch(e){}}
let S={score:0,lives:3,done:[]};
const L=[
{t:'Berpikir Komputasional',type:'choice',intro:'Sebelum membuat program, asah dulu cara berpikirmu!',q:[
['Membuat aplikasi kasir dipecah menjadi tugas kecil: input barang, hitung total, cetak struk. Ini disebut...',['Dekomposisi','Debugging','Kompilasi'],0,'Dekomposisi: memecah masalah besar menjadi bagian-bagian kecil.'],
['Toko melihat pelanggan yang membeli kopi hampir selalu membeli gula. Menemukan kemiripan seperti ini disebut...',['Abstraksi','Pengenalan pola','Algoritma'],1,'Pengenalan pola: menemukan keteraturan atau kemiripan pada data.'],
['Langkah-langkah berurutan dan jelas untuk menyelesaikan masalah disebut...',['Algoritma','Variabel','Antarmuka'],0,'Algoritma adalah urutan langkah yang jelas untuk menyelesaikan masalah.']]},
{t:'Menyusun Algoritma',type:'order',intro:'Urutkan algoritma kasir toko: diskon 10% jika total belanja lebih dari Rp100.000. Klik langkah sesuai urutan.',s:['Mulai','Baca harga dan jumlah barang','Hitung total = harga × jumlah','Jika total > 100.000, kurangi diskon 10%','Tampilkan total bayar','Selesai']},
{t:'Koding Robot Gudang',type:'code',intro:'Programkan robot 🤖 agar mengantar paket 📦. Hindari tembok 🧱. Susun perintah lalu jalankan.'},
{t:'Istilah Kecerdasan Artifisial',type:'match',intro:'Pilih istilah di kiri, lalu pasangkan dengan artinya di kanan.',p:[['Data latih','Contoh data untuk melatih model KA'],['Model','Hasil belajar dari data yang dipakai untuk menjawab'],['Prediksi','Keluaran model untuk data baru'],['Bias','Kecenderungan hasil tidak adil akibat data atau rancangan'],['Variabel','Wadah penyimpan nilai dalam program']]},
{t:'Etika dan Penerapan KA',type:'choice',intro:'Kamu bekerja di bengkel digital yang memakai KA. Ambil keputusan yang tepat!',q:[
['Asisten KA memberi harga suku cadang yang tampak janggal. Tindakan terbaik?',['Langsung dipakai','Cek ulang dengan sumber tepercaya','Abaikan semua jawaban KA'],1,'Hasil KA perlu diverifikasi sebelum dipakai mengambil keputusan.'],
['Kamu ingin melatih model dengan foto pelanggan. Apa yang harus dilakukan?',['Minta izin dan jaga privasi data','Pakai saja tanpa bilang','Unggah ke media sosial'],0,'Data pribadi wajib dilindungi dan dipakai dengan izin.'],
['Model deteksi kerusakan mesin sering salah pada mesin jenis tertentu. Solusinya?',['Diamkan saja','Tambah data latih yang lebih beragam','Hapus semua data'],1,'Data latih yang beragam mengurangi bias dan meningkatkan akurasi.']]}
];
const IC=['🧠','📝','🤖','🔗','⚖️'];
function topbar(){return `<div class="top"><b>🧪 Yukk Kerjain</b><span><span class="pill">⭐ ${S.score}</span><span class="pill">${'❤️'.repeat(S.lives)||'💔'}</span><span class="pill">${S.done.length}/5 level</span></span></div>`}
function bubs(){let h='';for(let k=0;k<7;k++)h+=`<div class="bub" style="left:${k*14+3}%;bottom:-${5+k*3}em;width:${2+k%3}em;height:${2+k%3}em;animation-delay:-${k*1.3}s"></div>`;return h}
function shell(i,body){const d=L.map((l,k)=>`<i class="${S.done.includes(k)?'on':k==i?'cur':''}"></i>`).join('');return topbar()+`<div class="main"><div class="card"><div class="lh"><span class="ic">${IC[i]}</span><div><small>Level ${i+1} dari 5</small><h2>${L[i].t}</h2></div><div class="dots">${d}</div></div><p class="intro">${L[i].intro}</p>${body}<div id="fb" class="fb i">${C.hint||''}</div></div><div class="nav"><button onclick="menu()">☰ Menu</button><button ${i>0?'':'disabled'} onclick="start(${i-1})">◀ Kembali</button><button ${i<4?'':'disabled'} onclick="start(${i+1})">Berikutnya ▶</button></div></div>`}
function home(){A.innerHTML=bubs()+`<div class="main" style="flex-direction:row;align-items:center;gap:2em;padding:2em 3em"><div style="flex:1.3"><small style="color:#99f6e4">GIM EDUKASI · KKA</small><h1>Yukk Kerjain</h1><h2 style="color:#fde68a;margin:.3em 0">Misi Koding dan Kecerdasan Artifisial</h2><p style="color:#fff">Bagaimana robot dan KA bisa bekerja sesuai perintahmu? Selesaikan 5 level dan buktikan kamu siap jadi programmer andal!</p><br><button class="p" style="font-size:1.4em" onclick="menu()">▶ Mulai Misi</button><button onclick="guide()">📖 Panduan</button><button onclick="about()">ℹ️ Info</button></div><div style="flex:1;text-align:center"><svg viewBox="0 0 200 220" style="width:90%"><rect x="20" y="190" width="160" height="10" rx="5" fill="#042f3f"/><path d="M85 20h30v60l45 90c6 12-2 20-14 20H54c-12 0-20-8-14-20l45-90z" fill="#e0f2fe" stroke="#fff" stroke-width="4"/><path d="M62 140h76l22 30c6 12-2 20-14 20H54c-12 0-20-8-14-20z" fill="#14b8a6"/><circle cx="85" cy="150" r="6" fill="#99f6e4"/><circle cx="115" cy="165" r="8" fill="#99f6e4"/><circle cx="100" cy="120" r="5" fill="#99f6e4"/><rect x="80" y="14" width="40" height="10" rx="4" fill="#f59e0b"/></svg></div></div>`}
function about(){A.innerHTML=topbar()+`<div class="main"><div class="card"><h2>ℹ️ Informasi Kreator</h2><p>Kreator: [Isi nama kreator, gelar]<br>Organisasi: [Isi nama institusi]</p><p>Seluruh ilustrasi dibuat dengan kode HTML/CSS/SVG (tanpa aset eksternal).</p><br><button onclick="home()">◀ Kembali</button></div></div>`}
function guide(){A.innerHTML=topbar()+`<div class="main"><div class="card"><h2>📖 Panduan</h2><ul style="margin-left:1.2em"><li>Pilih level di Menu secara bebas, tidak harus berurutan.</li><li>Jawaban benar menambah ⭐ skor, jawaban salah mengurangi ❤️ nyawa.</li><li>Nyawa habis? Level diulang dan nyawa dipulihkan.</li><li>Tujuan: memahami berpikir komputasional, algoritma, koding dasar, istilah KA, dan etika KA.</li></ul><br><button onclick="home()">◀ Laman Muka</button><button class="p" onclick="menu()">Ke Menu ▶</button></div></div>`}
function menu(){A.innerHTML=bubs()+topbar()+`<div class="main"><h1 style="font-size:2em;text-align:center">Peta Misi</h1><div class="map">${L.map((l,i)=>`<button class="node ${S.done.includes(i)?'d':''}" onclick="start(${i})"><div class="c">${S.done.includes(i)?'✅':IC[i]}</div><b>Level ${i+1}</b><span>${l.t}</span></button>`).join('')}</div><div class="bar"><i style="width:${S.done.length*20}%"></i></div><div class="nav"><button onclick="home()">🏠 Laman Muka</button><button class="p" onclick="final()">🏆 Evaluasi Akhir</button></div></div>`}
let C={};
function start(i){S.lives=3;C={i,n:0,sel:null,ok:[],v:0,stop:false};({choice:rc,match:rm,order:ro,code:rcode})[L[i].type]()}
function fb(m,ok){const f=document.getElementById('fb');f.className='fb '+(ok?'g':'b');f.textContent=m;snd(ok)}
function lose(){S.lives--;if(S.lives<=0){S.lives=3;setTimeout(()=>{alert('Nyawa habis! Level diulang.');start(C.i)},300)}else refreshTop()}
function refreshTop(){A.querySelector('.top').outerHTML=topbar()}
function win(){if(!S.done.includes(C.i))S.done.push(C.i);S.score+=50;refreshTop();const f=document.getElementById('fb');f.className='fb g';f.innerHTML='🎉 Level selesai! +50 skor bonus. Lanjut lewat tombol Berikutnya atau Menu.'}
function rc(){const l=L[C.i],q=l.q[C.n];C.hint='Pilih jawabanmu.';A.innerHTML=shell(C.i,`<p><b>Soal ${C.n+1}/${l.q.length}</b> &nbsp; ${q[0]}</p>`+q[1].map((o,k)=>`<button class="opt" data-a="1" onclick="ans(${k},this)"><b>${'ABC'[k]}</b>${o}</button>`).join(''))}
function ans(k,b){const q=L[C.i].q[C.n];if(k==q[2]){b.className='opt ok';S.score+=20;fb('Benar! '+q[3],1);refreshTop();document.querySelectorAll('[data-a]').forEach(x=>x.disabled=true);C.n++;if(C.n<L[C.i].q.length)setTimeout(rc,1800);else setTimeout(win,1000)}else{b.className='opt no';b.disabled=true;fb('Belum tepat. Coba lagi.',0);lose()}}
function rm(){const l=L[C.i],fs=l.p.map((p,i)=>i).sort((a,b)=>(a*3+1)%5-(b*3+1)%5);C.hint='Pilih alat terlebih dahulu.';A.innerHTML=shell(C.i,`<div class="row"><div class="col">${l.p.map((p,i)=>`<button id="a${i}" style="display:block;width:100%" onclick="pa(${i})">🔧 ${p[0]}</button>`).join('')}</div><div class="col">${fs.map(i=>`<button id="b${i}" style="display:block;width:100%" onclick="pb(${i})">${l.p[i][1]}</button>`).join('')}</div></div>`)}
function pa(i){if(C.ok.includes(i))return;C.sel=i;document.querySelectorAll('[id^=a]').forEach(b=>b.classList.remove('sel'));document.getElementById('a'+i).classList.add('sel')}
function pb(i){if(C.sel==null||C.ok.includes(i)){fb('Pilih alat di kiri dulu.',0);return}if(i==C.sel){C.ok.push(i);S.score+=20;['a','b'].forEach(p=>{const e=document.getElementById(p+i);e.className='ok';e.disabled=true});C.sel=null;fb('Benar!',1);refreshTop();if(C.ok.length==5)win()}else{const e=document.getElementById('b'+i);e.className='no';setTimeout(()=>{if(!C.ok.includes(i))e.className=''},700);fb('Pasangan belum tepat.',0);lose()}}
function ro(){const l=L[C.i],o=l.s.map((s,i)=>i).sort((a,b)=>(a*2+3)%6-(b*2+3)%6);C.hint='Klik langkah pertama.';A.innerHTML=shell(C.i,o.map(i=>`<button id="s${i}" class="opt" onclick="os(${i})"><b>?</b>${l.s[i]}</button>`).join(''))}
function os(i){if(i==C.n){const e=document.getElementById('s'+i);e.className='opt ok';e.disabled=true;e.firstChild.textContent=C.n+1;C.n++;S.score+=10;fb('Tepat!',1);refreshTop();if(C.n==6)win()}else{fb('Bukan langkah ini sekarang. Pikirkan urutan logisnya.',0);lose()}}
const D={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]},DI={U:'⬆️',D:'⬇️',L:'⬅️',R:'➡️'};
function drawg(x,y){let h='';for(let j=0;j<3;j++)for(let i=0;i<5;i++){const w=i==2&&j<2,g=i==4&&j==2,r=i==x&&j==y;h+=`<div style="height:3em;display:flex;align-items:center;justify-content:center;font-size:1.5em;border-radius:.3em;background:${w?'#fca5a5':g?'#fde68a':'#e0f2fe'}">${r?'🤖':w?'🧱':g?'📦':''}</div>`}document.getElementById('gr').innerHTML=h}
function dq(){document.getElementById('pq').textContent=C.q.map((k,n)=>(n+1)+'.'+DI[k]).join('  ')||'(belum ada perintah)'}
function rcode(){C.q=[];C.hint='Susun perintah (maks. 12), lalu tekan Jalankan.';A.innerHTML=shell(C.i,`<div class="row" style="align-items:center"><div class="col"><div id="gr" style="display:grid;grid-template-columns:repeat(5,1fr);gap:.2em"></div></div><div class="col"><p><b>Program:</b></p><p id="pq" style="min-height:3em"></p>${Object.keys(DI).map(k=>`<button onclick="cm('${k}')">${DI[k]}</button>`).join('')}<br><button onclick="C.q.pop();dq()">↩ Hapus terakhir</button><button onclick="C.q=[];dq();drawg(0,0)">🗑 Kosongkan</button><button class="p" onclick="runq()">▶ Jalankan</button></div></div>`);drawg(0,0);dq()}
function cm(k){if(C.run||C.stop)return;if(C.q.length<12)C.q.push(k);dq()}
function runq(){if(C.run||C.stop)return;if(!C.q.length){fb('Tambahkan perintah dulu.',0);return}C.run=1;let x=0,y=0,k=0;drawg(0,0);const t=setInterval(()=>{if(k>=C.q.length){clearInterval(t);C.run=0;if(x==4&&y==2){C.stop=1;S.score+=40;refreshTop();win()}else{fb('Robot berhenti sebelum sampai ke paket. Ubah programmu.',0);lose();drawg(0,0)}return}const d=D[C.q[k++]];x+=d[0];y+=d[1];if(x<0||y<0||x>4||y>2||(x==2&&y<2)){clearInterval(t);C.run=0;fb('Robot menabrak! Periksa urutan perintahmu.',0);lose();drawg(0,0);return}drawg(x,y)},400)}
function final(){const n=S.done.length,st='⭐'.repeat(Math.ceil(n*3/5))||'—';A.innerHTML=bubs()+topbar()+`<div class="main"><div class="card" style="text-align:center"><h2>🏆 Evaluasi Akhir</h2><p style="font-size:2.4em">${st}</p><p>Skor: <b>${S.score}</b> · Level selesai: ${n}/5 (${n*20}%)</p><p>${n==5?'Hebat! Kamu siap berkoding dan memakai KA dengan bijak.':'Ulangi level yang belum selesai agar kompetensimu lengkap.'}</p><br><button onclick="menu()">☰ Ke Menu</button><button class="p" onclick="S={score:0,lives:3,done:[]};home()">🔁 Main Lagi</button><br><br><small>Kreator: [Nama Kreator] · [Organisasi]</small></div></div>`}
fit();home();
</script></body></html>
